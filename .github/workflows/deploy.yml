name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site is served from https://<owner>.github.io/<repo>/, so Astro needs both.
      SITE: https://${{ github.repository_owner }}.github.io
      BASE: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      # Installs dependencies, runs `npm run build` (tokens, type check, Astro build) and uploads dist/.
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
